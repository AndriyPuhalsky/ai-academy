<!DOCTYPE html>
<html lang="uk" class="scroll-smooth" data-config="config.json">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Перевірка сертифіката — AI Академія</title>
  <meta name="theme-color" content="#141312" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ink: "#141312", surface: "#1E1B18", raised: "#272320", line: "#3A342E",
          ivory: "#F0EEE6", muted: "#A8A095", faint: "#7A7164",
          clay: "#D97757", "clay-deep": "#BD5F40", sand: "#E8DCC3"
        },
        fontFamily: {
          display: ["Literata", "Georgia", "serif"],
          sans: ["'IBM Plex Sans'", "system-ui", "sans-serif"],
          mono: ["'IBM Plex Mono'", "ui-monospace", "monospace"]
        },
        maxWidth: { content: "72rem" }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-ink font-sans text-ivory antialiased">
  <header class="sticky top-0 z-40 border-b border-line/70 bg-ink/85 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-content items-center justify-between gap-4 px-5 sm:px-8">
      <a href="index.html" class="flex items-center gap-2.5">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-clay font-mono text-sm font-semibold text-ink">AIA</span>
        <span class="font-display text-lg">AI Академія</span>
      </a>
      <a href="index.html#syllabus" class="text-sm text-muted transition hover:text-ivory">До курсу →</a>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-5 py-12 sm:px-8 sm:py-16">
    <p class="font-mono text-sm text-clay">Перевірка</p>
    <h1 class="mt-2 font-display text-4xl">Перевірити сертифікат</h1>
    <p class="mt-3 text-muted">Введи код із сертифіката, щоб підтвердити його справжність.</p>

    <div class="mt-6 flex gap-2">
      <input id="verifyInput" type="text" placeholder="Код сертифіката (напр. a1b2c3d4e5f6)"
             class="min-w-0 flex-1 rounded-lg border border-line bg-surface px-4 py-2.5 font-mono text-sm text-ivory outline-none transition focus:border-clay/60" />
      <button id="verifyBtn" type="button"
              class="shrink-0 rounded-lg bg-clay px-5 py-2.5 font-medium text-ink transition hover:bg-clay-deep">Перевірити</button>
    </div>

    <div id="verifyResult" class="mt-8"></div>
  </main>

  <script type="module" src="js/verify.js"></script>
</body>
</html>
