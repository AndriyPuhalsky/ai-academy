<!DOCTYPE html>
<!-- data-own-title: <title> на цій сторінці приходить із roadmap.json
     (copy.pageTitle), а не з config.json. Без цього прапорця два
     асинхронні fetch змагались би за document.title — див. js/config.js. -->
<html lang="uk" data-config="config.json" data-course="academy" data-density="landing" data-lit data-own-title>
<head>
  <meta charset="UTF-8" />
  <!-- Роадмап від початку не мав user-scalable=no. Задачею 004 (проходом 005,
       2026-09-04) цей провал WCAG 1.4.4 (AA) знято з решти 38 сторінок сайту,
       тож розбіжності більше немає — усі сторінки дозволяють зум. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Роадмап — AI Академія, AI Architect і AI Термінал</title>
  <meta name="description" content="Публічний план розвитку трьох освітніх платформ: що зроблено, що робимо просто зараз і що попереду." />
  <!-- Єдиний легальний хекс у HTML: дорівнює --p-n-100 у css/tokens.css.
       <meta> не читає var(), тому число тут дублюється свідомо. -->
  <meta name="theme-color" content="#161311" />
  <meta property="og:title" content="Роадмап — AI Академія, AI Architect і AI Термінал" />
  <meta property="og:description" content="Публічний план розвитку трьох освітніх платформ: що зроблено, що робимо просто зараз і що попереду." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Позначаємо, що JS увімкнено -->
  <script>document.documentElement.classList.add("js");</script>

  <!-- Шрифти 009: Prata (дисплейний) + Golos Text + JetBrains Mono.
       Латиниця вантажиться СВІДОМО: український апостроф ʼ (U+02BC) лежить
       у латинській підмножині Google Fonts, а не в кириличній. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Порядок обов'язковий: токени → компоненти → сторінковий файл →
       Tailwind → тема. Tailwind іде ПІСЛЯ наших <link> навмисно: його
       preflight має стояти в каскаді пізніше, ніж наші правила на голий тег.
       010 · етап 9: стара мова (окремий файл зі спадщиною 2023–2026)
       видалена цілком, тому в каскаді лишились рівно ці файли. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/roadmap.css" />


  <!-- Tailwind CDN + тема з токенів (js/tw-theme.js замість 66 інлайнових копій) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-theme.js"></script>
  <!-- 010 · css/roadmap.css підключений ОСТАННІМ із наших свідомо: 104 токени
       сторінки (--rm-*) переїхали сюди з глобального :root, який роздавав їх
       усім 66 сторінкам, хоч потрібні вони одній. Це і є структурне закриття
       колізії --rail-w 184/132. Блок стиснення hero @media (max-height: 700px)
       перевизначає --rm-fs-* теж тут. -->

  <!-- M1: @view-transition тут СВІДОМО НЕМАЄ. З ним кожен перехід на цю
       сторінку кидає неперехвачений InvalidStateError (перевірено справжнім
       кліком по <a href>, не лише програмною навігацією), і жодного переходу
       при цьому не видно: сторінка малюється після fetch даних, тобто
       транзакція скасовується. Повертати можна лише після тесту на реальній
       парі сторінок і з інлайненими в HTML даними. -->
</head>

<body id="top">

  <a class="ds-skip" href="#main">Перейти до вмісту</a>
  <div id="ariaLive" class="sr-only" aria-live="polite"></div>

  <noscript>
    <div class="ds-wrap ds-band">
      <div class="ds-note ds-note--warn" role="alert">
        <span class="ds-note__glyph" aria-hidden="true">▲</span>
        <p class="ds-note__body">Ця сторінка збирається з файлу даних, тож для неї потрібен JavaScript.
      Курси працюють і без нього — <a class="underline" data-brand-back href="index.html">поверніться до курсу</a>.</p>
      </div>
    </div>
  </noscript>

  <header class="rm-head">
    <div class="rm-head__in">
      <a href="#top" class="rm-brand">
        <span class="rm-brand__mark" aria-hidden="true">AIA</span>
        <span class="rm-brand__name">Роадмап</span>
      </a>
      <a id="backLink" href="index.html" class="rm-back">
        <span class="rm-back__arrow" aria-hidden="true">←</span>
        <span id="backLabel">До AI Академії</span>
      </a>
    </div>
  </header>

  <!-- ⚠ `data-page-in` тут НЕМАЄ СВІДОМО (рішення 011 №2, 2026-09-10).
       Вхід сторінки належить js/roadmap-motion.js:674 — рядки заголовка з-за маски.
       M1 стартує на DOMContentLoaded, вхід 003 — через 1–4 мс, тобто накладання
       стовідсоткове: заміряно 360 мс притемнення поверх хореографії. Один вхід на
       сторінку. Обґрунтування й числа — dev/build/011-open-tails/05-decisions/. -->
  <main id="main">

    <!-- УВАГА: у цій розмітці немає жодного пункту, жодної назви секції
         і жодного заголовка. Увесь текст сторінки приходить із roadmap.json
         через js/roadmap-render.js (критерій приймання 13). Винятки за
         побудовою: <title>/<meta>/og:* і літерали renderError() — вони
         працюють саме тоді, коли даних немає. -->

    <section class="rm-hero" aria-labelledby="heroTitle">
      <div class="rm-hero__in">
        <p class="rm-eyebrow" id="heroEyebrow"><span class="rm-eyebrow__slash" aria-hidden="true">//</span>&nbsp;</p>
        <h1 class="rm-hero__title" id="heroTitle"></h1>
        <p class="rm-hero__lead" id="heroLead"></p>
        <dl class="rm-counts" id="heroCounts" aria-label="Стан плану розвитку"></dl>
        <p class="rm-updated" id="heroUpdated"></p>
      </div>
    </section>

    <div class="rm-timeline" id="timeline">
      <svg class="rm-trail" id="trail" aria-hidden="true" focusable="false" preserveAspectRatio="none"></svg>
      <span class="rm-axis" id="axisProbe" aria-hidden="true"></span>
      <div class="rm-sections" id="sections"></div>
    </div>

    <section class="rm-outro" id="outro" aria-labelledby="outroTitle" hidden></section>

  </main>

  <!-- ФУТЕР -->
  <footer class="ds-ftr">
    <div class="ds-ftr__grid">
      <div>
        <p class="ds-h4" data-brand>AI Академія</p>
        <p class="ds-small" data-site="disclaimer"></p>
      </div>
      <nav aria-label="Посилання проєкту">
        <p class="ds-eyebrow">Проєкт</p>
        <!-- ⚠ Список ЗМІННОЇ довжини: js/config.js видаляє <li> з порожнім
             data-link, а links.github і links.telegram порожні в усіх трьох
             конфігах. Реально людина бачить два рядки, а не чотири (П-11). -->
        <ul class="ds-ftr__list">
          <li><a href="certificate.html">Мої сертифікати ↗</a></li>
          <li><a data-link="github" href="#">GitHub ↗</a></li>
          <li><a data-link="telegram" href="#">Telegram ↗</a></li>
          <li><button type="button" id="contactTrigger" class="ds-btn ds-btn--quiet ds-btn--sm">Написати нам</button></li>
        </ul>

        <!-- 003 · точка входу на сторінку плану розвитку. Стоїть ПІСЛЯ списку,
             усередині тієї самої nav: .rm-entry не рядок списку. -->
        <a class="rm-entry" href="#top" aria-current="page">
          <span class="rm-entry__label">План розвитку</span>
          <span class="rm-entry__arrow" aria-hidden="true">→</span>
          <span class="rm-entry__rule" aria-hidden="true"></span>
        </a>
      </nav>
      <nav aria-label="Першоджерела">
        <p class="ds-eyebrow">Першоджерела</p>
        <ul class="ds-ftr__list">
          <li><a data-link="officialDocs" href="#">Документація Claude ↗</a></li>
          <li><a data-link="officialCourses" href="#">Офіційні курси Anthropic ↗</a></li>
        </ul>
      </nav>
    </div>
    <div class="ds-ftr__bar">
      <!-- #footerMeta тут свідомо немає: дата оновлення роадмапу вже стоїть
           у hero (з roadmap.json), а config.json дав би другу дату. -->
      <span></span>
      <span>Зроблено спільнотою · <a href="#top">Нагору ↑</a></span>
    </div>
  </footer>

  <!-- GSAP 3.13.0, рівно три файли: ядро + ScrollTrigger + CustomEase.
       Решту плагінів свідомо не беремо — обґрунтування кожного в §4
       dev/design/003-roadmap/SUMMARY.md. Ліцензія: gsap.com/licensing —
       усе GSAP безкоштовне для комерційного використання з 30.04.2025,
       атрибуції не вимагає. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
  <script src="js/motion.js"></script>

  <!-- Порядок render → motion безпечний: обидва класичні скрипти, парсяться
       синхронно, тому слухач rm:rendered у motion реєструється раніше, ніж
       може завершитись fetch у render. -->
  <script src="js/roadmap-render.js"></script>
  <script src="js/roadmap-motion.js"></script>
  <!-- Модалка «Написати нам»: Cloudflare Turnstile підвантажує лише сама -->
  <script type="module" src="js/contact.js"></script>
  <!-- Дискламер і посилання у футері з config.json -->
  <script src="js/config.js"></script>
</body>
</html>
