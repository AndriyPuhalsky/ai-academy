<!doctype html>
<!-- 011 · рядок 11, проба кореневої сесії 2026-09-10: три аркуші сертифіката + додаток
     з акцентом СВОГО курсу. Supabase заглушений, у мережу нічого не йде; сторінка в dev/
     (не роздається, .assetsignore). Відкривати з кореня: /dev/build/011-open-tails/probe-cert-accent.html -->
<html lang="uk" data-course="academy">
<head>
  <meta charset="utf-8">
  <title>Проба акценту PDF</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <style>body{margin:0;background:#333;padding:16px}.sheet{position:static!important;left:auto!important;margin:0 0 16px}</style>
</head>
<body>
  <div id="certBody"></div>
  <script>window.AIA_USER=null; window.sb={from:function(){return{select:function(){return{order:function(){return Promise.resolve({data:[],error:null});}};}};}};</script>
  <script src="/js/certificate.js"></script>
  <script>
    var C = window.AIACert;
    var slugs = [["ai-essentials","AI Essentials"],["ai-architect","AI Architect"],["claude-code","AI Термінал"]];
    slugs.forEach(function (s) {
      var cert = { courses: { slug: s[0], title: s[1] }, full_name: "Тестове Імʼя", public_code: "AIA-PROBE-0000", issued_at: "2026-09-10T12:00:00Z" };
      var n = C.buildCertNode(cert, "");
      n.className = "sheet"; document.body.appendChild(n);
    });
    var rows = []; for (var i = 1; i <= 12; i++) rows.push({ number: i, title: "Модуль " + i, score: 80 + (i % 5) * 4 });
    var t = C.buildTranscriptNode({ courses: { slug: "claude-code", title: "AI Термінал" }, full_name: "Тестове Імʼя", public_code: "AIA-PROBE-0000" }, rows);
    t.className = "sheet"; document.body.appendChild(t);
    document.title = "готово";
  </script>
</body>
</html>
