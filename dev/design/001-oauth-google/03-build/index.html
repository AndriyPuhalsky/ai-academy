<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>001 — Вхід через Google · живий макет</title>

  <!--
    Шрифти — рівно той самий рядок, що вже стоїть у index.html:20.
    Google Sans тут НЕМАЄ і бути не може: рішення власника
    00-decisions.md §7.4 забороняє будь-який запит по цій гарнітурі.
    Логотип Google — інлайновий SVG, нуль мережевих запитів.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="rig">

    <!-- Панель станів. Це риштування макета, а не елемент сайту. -->
    <nav class="rig__rail" id="rail" aria-label="Стани макета"></nav>

    <div class="rig__stage">

      <div class="rig__toolbar" id="toolbar">
        <span>ширина</span>
        <span class="rig__seg">
          <button type="button" data-set="width:1280">1280</button>
          <button type="button" data-set="width:390">390</button>
          <button type="button" data-set="width:320">320</button>
        </span>

        <span>сторінка</span>
        <span class="rig__seg">
          <button type="button" data-set="page:home">головна</button>
          <button type="button" data-set="page:module">модуль</button>
        </span>

        <span>сесія</span>
        <span class="rig__seg">
          <button type="button" data-set="session:guest">гість</button>
          <button type="button" data-set="session:user">залогінений</button>
        </span>

        <span>рух</span>
        <span class="rig__seg">
          <button type="button" data-set="rm:false">повний</button>
          <button type="button" data-set="rm:true">reduced</button>
        </span>
      </div>

      <p class="rig__note" id="note"></p>

      <!--
        Сцена. container-type: inline-size → репліка реагує на ширину
        контейнера так само, як реагувала б на viewport, тому 320 px
        видно чесно, без ресайзу вікна.
        На реальному сайті підложка модалки — position: fixed; inset: 0;
        тут вона absolute, бо живе всередині сцени.
      -->
      <div class="stage" id="stage" data-w="1280">
        <div class="stage__scroll" id="stageScroll"></div>
      </div>

    </div>
  </div>

  <script src="motion.js"></script>
</body>
</html>
