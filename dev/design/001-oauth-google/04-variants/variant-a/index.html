<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>001 · варіант A — Тихий банер</title>

  <!--
    Шрифти — рівно той самий рядок, що вже стоїть у index.html:20 сайту.
    Google Sans тут немає і бути не може (рішення власника §7.4).
    Логотип Google — інлайновий SVG, нуль мережевих запитів.
    Перевірено валідатором у вкладці Network: зовнішніх запитів лише
    fonts.googleapis.com + fonts.gstatic.com по Literata / IBM Plex.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- СПІЛЬНІ для всіх трьох варіантів. Різниця між A/B/C — у variant.js
       і в кількох значеннях токенів, а не в окремих системах. -->
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/base.css" />
</head>

<body>
  <div class="rig">
    <nav class="rig__rail" id="rail" aria-label="Стани макета"></nav>

    <div class="rig__stage">
      <div class="rig__toolbar" id="toolbar">
        <span>ширина</span>
        <span class="rig__seg">
          <button type="button" data-set="width:1280">1280</button>
          <button type="button" data-set="width:390">390</button>
          <button type="button" data-set="width:320">320</button>
        </span>

        <span>сторінка</span>
        <span class="rig__seg">
          <button type="button" data-set="page:home">головна</button>
          <button type="button" data-set="page:module">модуль</button>
        </span>

        <span>сесія</span>
        <span class="rig__seg">
          <button type="button" data-set="session:guest">гість</button>
          <button type="button" data-set="session:user">залогінений</button>
        </span>

        <span>рух</span>
        <span class="rig__seg">
          <button type="button" data-set="rm:false">повний</button>
          <button type="button" data-set="rm:true">reduced</button>
        </span>

        <span>прев'ю імені</span>
        <span class="rig__seg">
          <button type="button" data-set="paper:bleed">папір в обріз</button>
          <button type="button" data-set="paper:tile">темна плитка</button>
        </span>
      </div>

      <p class="rig__note" id="note"></p>

      <div class="stage" id="stage" data-w="1280">
        <div class="stage__scroll" id="stageScroll"></div>
      </div>
    </div>
  </div>

  <!-- variant.js оголошує window.AIA_VARIANT ДО двигуна -->
  <script src="variant.js"></script>
  <script src="../shared/base.js"></script>
</body>
</html>
