<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>one</title>
<style>html,body{margin:0;background:#444}iframe{border:0;display:block;margin:0 auto;background:#000}</style></head>
<body><script>
const q=new URLSearchParams(location.search);
const w=q.get('w')||390, h=q.get('h')||844, p=q.get('p')||'_base/index.html';
document.write(`<iframe id="f" width="${w}" height="${h}" src="../${p}"></iframe>`);
window.sc=(y)=>{f.contentWindow.scrollTo(0,y);return f.contentWindow.scrollY+'/'+f.contentDocument.body.scrollHeight;};
window.frm=()=>f.contentWindow;
</script></body></html>
