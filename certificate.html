<!DOCTYPE html>
<html lang="uk" data-config="config.json" data-course="academy" data-density="lesson" data-lit>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мій сертифікат — AI Академія</title>
  <!-- Єдиний легальний хекс у HTML: дорівнює --p-n-100 у css/tokens.css.
       <meta> не читає var(), тому число тут дублюється свідомо. -->
  <meta name="theme-color" content="#161311" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Порядок обов'язковий: стара мова → токени → компоненти → сторінковий
       файл → Tailwind → тема. Tailwind іде ПІСЛЯ наших <link> навмисно.
       css/custom.css лишається до етапу 9 і стоїть ПЕРШИМ, щоб на спільних
       селекторах (:focus-visible, .term, .rm-entry, .gbtn) вигравала нова система. -->
  <link rel="stylesheet" href="css/custom.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />


  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-theme.js"></script>
</head>
<body>

  <a class="ds-skip" href="#main">Перейти до вмісту</a>
  <div id="ariaLive" class="sr-only" aria-live="polite"></div>

  <header class="ds-hdr">
    <div class="ds-hdr__inner">
      <a class="ds-hdr__brand" href="index.html">
        <span class="ds-hdr__mark" aria-hidden="true">AIA</span>
        <span>AI Академія</span>
      </a>
      <span class="ds-hdr__crumb" aria-hidden="true">/</span>
      <span class="ds-hdr__crumb">Мої сертифікати</span>
      <span class="ds-hdr__spacer"></span>
      <a class="ds-nav__link" href="index.html#syllabus">Курс</a>
      <a class="ds-nav__link" href="verify.html">Перевірка</a>
      <div id="aiaAuth" class="ds-hdr__slot"></div>
      <span id="navProgress" hidden class="ds-pill ds-pill--unknown"></span>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-3xl px-5 py-12 sm:px-8 sm:py-16">
    <p class="font-mono text-sm text-clay">Сертифікати</p>
    <h1 class="mt-2 font-display text-4xl">Мій сертифікат</h1>
    <p class="mt-3 text-muted">Тут зберігаються сертифікати за пройдені курси. Завантаж PDF або поділись посиланням на перевірку.</p>

    <div id="certBody" class="mt-8">
      <p class="text-muted">Завантажуємо…</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/certificate.js"></script>
  <!-- ui.js потрібен саме тут: у ньому живе AIA.chrome.initDropdown, яким
       js/auth-ui.js відкриває аркуш акаунта в шапці (рішення власника Р-1). -->
  <script src="js/ui.js"></script>
  <script src="js/auth-ui.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
