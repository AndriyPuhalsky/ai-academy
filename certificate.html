<!DOCTYPE html>
<html lang="uk" data-config="config.json" data-course="academy" data-density="lesson" data-lit>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мій сертифікат — AI Академія</title>
  <!-- Єдиний легальний хекс у HTML: дорівнює --p-n-100 у css/tokens.css.
       <meta> не читає var(), тому число тут дублюється свідомо. -->
  <meta name="theme-color" content="#161311" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Порядок обов'язковий: токени → компоненти → сторінковий файл →
       Tailwind → тема. Tailwind іде ПІСЛЯ наших <link> навмисно: його
       preflight має стояти в каскаді пізніше, ніж наші правила на голий тег.
       010 · етап 9: стара мова (окремий файл зі спадщиною 2023–2026)
       видалена цілком, тому в каскаді лишились рівно ці файли. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />


  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-theme.js"></script>
</head>
<body>

  <a class="ds-skip" href="#main">Перейти до вмісту</a>
  <div id="ariaLive" class="sr-only" aria-live="polite"></div>

  <header class="ds-hdr">
    <div class="ds-hdr__inner">
      <a class="ds-hdr__brand" id="certBrandLink" href="index.html">
        <span class="ds-hdr__mark" id="certBrandMark" aria-hidden="true">AIA</span>
        <span id="certBrandName">AI Академія</span>
      </a>
      <span class="ds-hdr__crumb" aria-hidden="true">/</span>
      <span class="ds-hdr__crumb">Мої сертифікати</span>
      <span class="ds-hdr__spacer"></span>
      <a class="ds-nav__link" id="certCourseLink" href="index.html#syllabus">Курс</a>
      <a class="ds-nav__link" href="verify.html">Перевірка</a>
      <div id="aiaAuth" class="ds-hdr__slot"></div>
      <span id="navProgress" hidden class="ds-pill ds-pill--unknown"></span>
    </div>
  </header>

  <!-- Бренд сторінки — за ТОЧКОЮ ВХОДУ, тим самим механізмом, що на /roadmap
       (js/roadmap-render.js, таблиця COURSES). Сторінка одна на три курси й
       показує список сертифікатів, тому «курс сертифіката» тут не визначений:
       карток може бути кілька, а в станах «гість» і «ще немає» — жодної.
       Скрипт стоїть ТУТ, бо перед js/certificate.js лежать три парсер-блокувальні
       скрипти з CDN, і бренд, підмінений після них, був би видимим перемиганням. -->
  <script>
  (function () {
    var MAP = {
      academy:       { course: "academy",   mono: "AIA", name: "AI Академія",
                       home: "index.html",       program: "index.html#syllabus" },
      architect:     { course: "architect", mono: "AIA", name: "AI Architect",
                       home: "architect.html",   program: "architect.html#syllabus" },
      "claude-code": { course: "terminal",  mono: "AIT", name: "AI Термінал",
                       home: "claude-code.html", program: "claude-code.html#map" }
    };
    var key = "";
    try { key = new URLSearchParams(location.search).get("from") || ""; } catch (e) {}
    if (!MAP[key] && document.referrer) {
      // Порядок обовʼязковий: «claude-code» перевіряємо ПЕРШИМ, інакше урок
      // /modules/claude-code-05 не мав би шансу — у ньому немає «architect»,
      // але порядок лишається однаковим із roadmap-render.js.
      if (/claude-code/i.test(document.referrer)) key = "claude-code";
      else if (/architect/i.test(document.referrer)) key = "architect";
    }
    // Повернення з Google: redirectTo в js/auth.js стриже ?search, referrer —
    // accounts.google.com. Памʼять вкладки — єдиний спосіб не втратити бренд.
    if (!MAP[key]) { try { key = sessionStorage.getItem("aia:certFrom") || ""; } catch (e) {} }
    var b = MAP[key] || MAP.academy;
    if (MAP[key]) { try { sessionStorage.setItem("aia:certFrom", key); } catch (e) {} }
    document.documentElement.setAttribute("data-course", b.course);
    document.title = "Мій сертифікат — " + b.name;
    var q = function (id) { return document.getElementById(id); };
    if (q("certBrandMark")) q("certBrandMark").textContent = b.mono;
    if (q("certBrandName")) q("certBrandName").textContent = b.name;
    if (q("certBrandLink")) q("certBrandLink").setAttribute("href", b.home);
    if (q("certCourseLink")) q("certCourseLink").setAttribute("href", b.program);
    window.AIA_CERT = b;
  })();
  </script>

  <main id="main" class="mx-auto max-w-prose px-5 py-10 sm:px-8 sm:py-16" data-page-in>
    <p class="ds-eyebrow">Сертифікати</p>
    <h1 class="ds-h2 mt-2">Мій сертифікат</h1>
    <p class="ds-lead mt-4">Тут зберігаються сертифікати за пройдені курси. Завантаж PDF або поділись посиланням на перевірку.</p>

    <!-- Стани малює js/certificate.js: гість · завантаження · порожньо ·
         одна чи кілька карток · помилка списку. Стартовий скелетон стоїть у
         розмітці, щоб перший кадр не був порожнім рядком тексту. -->
    <div id="certBody" class="mt-8 grid gap-4">
      <div class="ds-card">
        <span class="ds-skel ds-skel--name" style="display:block" aria-hidden="true"></span>
        <span class="ds-skel ds-skel--certs mt-4" style="display:block" aria-hidden="true"></span>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/certificate.js"></script>
  <!-- ui.js потрібен саме тут: у ньому живе AIA.chrome.initDropdown, яким
       js/auth-ui.js відкриває аркуш акаунта в шапці (рішення власника Р-1). -->
  <script src="js/ui.js"></script>
  <script src="js/auth-ui.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
