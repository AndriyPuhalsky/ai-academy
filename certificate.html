<!DOCTYPE html>
<html lang="uk" class="scroll-smooth" data-config="config.json">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мій сертифікат — AI Академія</title>
  <meta name="theme-color" content="#141312" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ink: "#141312", surface: "#1E1B18", raised: "#272320", line: "#3A342E", "line-strong": "#736A5E",
          ivory: "#F0EEE6", muted: "#A8A095", faint: "#9A9184",
          clay: "#D97757", "clay-deep": "#C4674A", sand: "#E8DCC3"
        },
        fontFamily: {
          display: ["Literata", "Georgia", "serif"],
          sans: ["'IBM Plex Sans'", "system-ui", "sans-serif"],
          mono: ["'IBM Plex Mono'", "ui-monospace", "monospace"]
        },
        maxWidth: { content: "72rem" }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-ink font-sans text-ivory antialiased">
  <div id="ariaLive" class="sr-only" aria-live="polite"></div>

  <header class="sticky top-0 z-40 border-b border-line/70 bg-ink/85 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-content items-center justify-between gap-4 px-5 sm:px-8">
      <a href="index.html" class="flex items-center gap-2.5">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-clay font-mono text-sm font-semibold text-ink">AIA</span>
        <span class="font-display text-lg">AI Академія</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="index.html#syllabus" class="text-sm text-muted transition hover:text-ivory">Курс</a>
        <a href="verify.html" class="text-sm text-muted transition hover:text-ivory">Перевірка</a>
        <div id="aiaAuth" class="slot"></div>
        <span id="navProgress" hidden class="rounded-full border border-line px-3 py-1 font-mono text-xs text-sand"></span>
      </div>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-3xl px-5 py-12 sm:px-8 sm:py-16">
    <p class="font-mono text-sm text-clay">Сертифікати</p>
    <h1 class="mt-2 font-display text-4xl">Мій сертифікат</h1>
    <p class="mt-3 text-muted">Тут зберігаються сертифікати за пройдені курси. Завантаж PDF або поділись посиланням на перевірку.</p>

    <div id="certBody" class="mt-8">
      <p class="text-muted">Завантажуємо…</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/certificate.js"></script>
  <script src="js/auth-ui.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
